<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23EF4444'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='bold' text-anchor='middle' fill='white'%3E%24%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signing in… | FinPass AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="auth-page min-h-screen flex items-center justify-center p-4 transition-colors duration-300 relative">

  <div class="w-full max-w-md animate-slide-up relative z-10">
    <div class="bg-white/70 dark:bg-white/5 backdrop-blur-xl border border-white/80 dark:border-white/10 rounded-2xl p-8 shadow-2xl transition-colors duration-200 text-center">

      <div id="cb-loading" class="animate-fade-in">
        <svg class="animate-spin h-10 w-10 mx-auto text-indigo-500 dark:text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <h1 class="text-lg font-semibold text-slate-900 dark:text-white mt-4 transition-colors">Completing sign in…</h1>
        <p class="text-slate-500 dark:text-white text-sm mt-1 transition-colors">Please wait while we log you in.</p>
      </div>

      <div id="cb-error" class="hidden">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-red-100 dark:bg-red-500/10 mb-4">
          <svg class="w-7 h-7 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z" />
          </svg>
        </div>
        <h1 class="text-lg font-semibold text-slate-900 dark:text-white transition-colors">Sign in failed</h1>
        <p id="cb-error-msg" class="text-slate-500 dark:text-white text-sm mt-1 mb-6 transition-colors">Something went wrong.</p>
        <a href="/static/login.html" class="btn-primary inline-block text-center">Back to login</a>
      </div>

    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script type="module" src="../js/callback.js"></script>
</body>

</html>
