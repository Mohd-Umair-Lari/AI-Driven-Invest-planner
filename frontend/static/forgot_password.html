<!DOCTYPE html>
<html lang="en" class="scroll-smooth h-full">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23EF4444'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='bold' text-anchor='middle' fill='white'%3E%24%3C/text%3E%3C/svg%3E">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FinPass AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="auth-page min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-200">

    <div class="w-full max-w-md">
        <div class="flex justify-center mb-8">
            <a href="/static/index.html" class="flex items-center gap-2 cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-black shadow-lg shadow-red-500/30 dark:from-cyan-400 dark:to-yellow-500 dark:shadow-cyan-500/30 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-slate-900 dark:text-white">FinPass AI</span>
            </a>
        </div>

        <div class="glass-card rounded-2xl p-8">
            <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2 text-center">Forgot Password?</h1>
            <p class="text-slate-600 dark:text-slate-400 text-center mb-8">Enter your email and we'll send you a link to reset your password</p>

            <form id="forgotPasswordForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-white mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="input-field w-full" 
                        placeholder="you@example.com"
                        required
                    />
                </div>

                <div id="errorMessage" class="hidden p-4 rounded-lg bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/30">
                    <p class="text-sm text-red-800 dark:text-red-300"></p>
                </div>

                <div id="successMessage" class="hidden p-4 rounded-lg bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30">
                    <p class="text-sm text-emerald-800 dark:text-emerald-300 font-medium">
                        ✓ If an account exists with this email, you'll receive a password reset link shortly.
                    </p>
                </div>

                <button 
                    type="submit" 
                    class="btn-primary w-full text-white py-2.5 rounded-lg font-semibold transition-all"
                    id="submitBtn"
                >
                    Send Reset Link
                </button>

                <div id="loadingSpinner" class="hidden flex items-center justify-center gap-2">
                    <div class="w-5 h-5 border-2 border-red-500 dark:border-yellow-400 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-slate-600 dark:text-slate-400">Sending email...</span>
                </div>
            </form>

            <div class="my-8 flex items-center gap-3">
                <div class="flex-1 h-px bg-slate-200 dark:bg-white/10"></div>
                <span class="text-xs text-slate-500 dark:text-slate-400">OR</span>
                <div class="flex-1 h-px bg-slate-200 dark:bg-white/10"></div>
            </div>

            <div class="space-y-3">
                <p class="text-center text-slate-600 dark:text-slate-400">
                    Remember your password? 
                    <a href="/static/login.html" class="text-red-600 dark:text-yellow-400 font-medium hover:underline">Sign In</a>
                </p>
                <p class="text-center text-slate-600 dark:text-slate-400">
                    Don't have an account? 
                    <a href="/static/register.html" class="text-red-600 dark:text-yellow-400 font-medium hover:underline">Create Account</a>
                </p>
            </div>
        </div>


    </div>

    <script src="../js/theme.js"></script>
    <script>
        const isDev = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        const BACKEND_URL = isDev ? "http://localhost:5000" : "https://umairlari-ai-financial-advisor-backend.hf.space";
        
        const form = document.getElementById('forgotPasswordForm');
        const email = document.getElementById('email');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMessage.classList.add('hidden');
            successMessage.classList.add('hidden');

            if (!email.value.trim()) {
                showError('Please enter your email address');
                return;
            }
            
            submitBtn.disabled = true;
            loadingSpinner.classList.remove('hidden');
            submitBtn.classList.add('opacity-50');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email.value.trim()
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(data.message || 'Password reset link sent! Check your email.');
                    form.reset();
                } else {
                    showError(data.message || 'Failed to send reset email');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to send reset email. Please check your internet connection.');
            } finally {
                submitBtn.disabled = false;
                loadingSpinner.classList.add('hidden');
                submitBtn.classList.remove('opacity-50');
            }
        });

        function showError(message) {
            errorMessage.querySelector('p').textContent = message;
            errorMessage.classList.remove('hidden');
        }

        function showSuccess(message) {
            successMessage.querySelector('p').textContent = message;
            successMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
