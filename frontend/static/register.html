<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | FinPass AI – Create Your Account</title>
  <meta name="description" content="Create your FinPass AI account and start your intelligent financial planning journey." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          animation: {
            'slide-up': 'slideUp 0.5s ease-out',
          },
          keyframes: {
            slideUp: { from: { opacity: '0', transform: 'translateY(24px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="auth-page min-h-screen flex items-center justify-center p-4 transition-colors duration-300 relative">

  <div class="fixed top-6 right-6 z-50">
    <button id="theme-toggle" class="p-2.5 rounded-full bg-white/80 dark:bg-slate-800/80 backdrop-blur-sm border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-700 transition-colors shadow-sm focus:outline-none">
        <svg id="theme-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

        </svg>
    </button>
  </div>

  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-violet-600 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-20 dark:opacity-10 animate-pulse"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-20 dark:opacity-10 animate-pulse" style="animation-delay:1.5s"></div>
  </div>

  <div class="w-full max-w-md animate-slide-up relative z-10">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-red-500 to-black dark:from-cyan-400 dark:to-yellow-500 shadow-lg shadow-red-500/30 dark:shadow-cyan-400/30 mb-3">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight transition-colors">FinPass AI</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-1 transition-colors">Start your financial journey today</p>
    </div>

    <div class="bg-white/70 dark:bg-white/5 backdrop-blur-xl border border-white/80 dark:border-white/10 rounded-2xl p-8 shadow-2xl transition-colors duration-200">
      <h2 class="text-xl font-semibold text-slate-900 dark:text-white mb-1 transition-colors">Create account</h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm mb-6 transition-colors">Fill in your details to get started</p>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider transition-colors">Full Name</label>
          <input id="name" type="text" placeholder="John Doe" class="input-field" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider transition-colors">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com" class="input-field" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider transition-colors">Password</label>
          <input id="password" type="password" placeholder="Min. 8 characters" class="input-field" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider transition-colors">Age</label>
            <input id="age" type="number" placeholder="25" class="input-field" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 uppercase tracking-wider transition-colors">Employment</label>
            <select id="status" class="select-field">
              <option value="">Select status</option>
              <option value="Salaried">Salaried</option>
              <option value="Self-Employed">Self-Employed</option>
              <option value="Freelancer">Freelancer</option>
              <option value="Unemployed">Unemployed</option>
            </select>
          </div>
        </div>
      </div>

      <button id="register-btn" class="btn-primary mt-6">
        Create Account
      </button>

      <p class="text-center text-slate-500 dark:text-slate-400 text-sm mt-5 transition-colors">
        Already have an account?
        <a href="./login.html" class="text-indigo-600 dark:text-indigo-400 font-medium hover:text-indigo-500 dark:hover:text-indigo-300 transition-colors">Sign in</a>
      </p>
    </div>

    <p class="text-center text-xs text-slate-500 dark:text-slate-600 mt-6 transition-colors">© 2025 FinPass AI · For educational use only</p>
  </div>

  <script src="../js/theme.js"></script>
  <script type="module" src="../js/register.js"></script>
</body>
</html>
