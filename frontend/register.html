<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | FinPass AI - Create Your Account</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 32px;">
        <div style="font-size: 48px; margin-bottom: 12px;">💰</div>
        <h1 style="font-size: 28px; margin-bottom: 8px;">FinPass AI</h1>
        <p style="color: #6b7280; font-size: 14px;">Your Intelligent Financial Advisor</p>
      </div>
      
      <h2 style="font-size: 24px; margin-bottom: 8px; color: #111827;">Create Account</h2>
      <p style="color: #6b7280; margin-bottom: 24px; font-size: 14px;">Start your financial journey</p>
      
      <input id="name" placeholder="Full Name" type="text" />
      <input id="email" placeholder="Email Address" type="email" />
      <input id="password" placeholder="Password" type="password" />
      <input id="age" placeholder="Age" type="number" />
      
      <select id="status" style="background: white; cursor: pointer;">
        <option value="">Select Employment Status</option>
        <option value="Salaried">Salaried</option>
        <option value="Self-Employed">Self-Employed</option>
        <option value="Freelancer">Freelancer</option>
        <option value="Unemployed">Unemployed</option>
      </select>
      
      <button id="register-btn" style="width: 100%; font-size: 16px; padding: 12px; margin-bottom: 12px;">Create Account</button>
      
      <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        Already have an account?
        <a href="./index.html" style="font-weight: 600; color: #4f46e5; text-decoration: none;">Sign in</a>
      </p>
    </div>
  </div>
  <script type="module" src="./js/register.js"></script>
</body>
</html>
