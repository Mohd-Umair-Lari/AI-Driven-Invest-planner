<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | FinPass AI - Smart Financial Planning</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 32px;">
        <div style="font-size: 48px; margin-bottom: 12px;">💰</div>
        <h1 style="font-size: 28px; margin-bottom: 8px;">FinPass AI</h1>
        <p style="color: #6b7280; font-size: 14px;">Your Intelligent Financial Advisor</p>
      </div>
      
      <h2 style="font-size: 24px; margin-bottom: 8px; color: #111827;">Welcome Back</h2>
      <p style="color: #6b7280; margin-bottom: 24px; font-size: 14px;">Sign in to manage your finances</p>
      
      <input type="email" id="login-email" placeholder="Enter your email" />
      <input type="password" id="login-password" placeholder="Enter your password" />
      
      <button id="login-btn" style="width: 100%; font-size: 16px; padding: 12px; margin-bottom: 12px;">Login</button>
      
      <p style="text-align: center; margin-top: 16px; font-size: 14px;">
        Don't have an account?
        <a href="./register.html" style="font-weight: 600; color: #4f46e5; text-decoration: none;">Create one</a>
      </p>
      
      <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid #e5e7eb;">
        <p style="color: #6b7280; font-size: 12px; text-align: center; margin: 0;">
          Demo: lol@example.com / 12345678
        </p>
      </div>
    </div>
  </div>
  <script type="module" src="./js/login.js"></script>
</body>
</html>
<!DOCTYPE html>
